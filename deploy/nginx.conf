# Version navigateur de FireStop Tracker, servie par nginx sur le VPS.
#
# L'application est un dossier de fichiers statiques : `build/web`, produit par
#
#   flutter build web --release --dart-define-from-file=env.json --no-web-resources-cdn
#
# et copié tel quel dans /var/www/firestop. Aucun programme ne tourne sur le
# VPS pour elle : comptes, données et clichés restent chez Supabase.
#
# À ADAPTER avant usage :
#   - `app.exemple.be` : le nom de domaine (quatre endroits) ;
#   - `<projet>` : l'identifiant du projet Supabase, celui de SUPABASE_URL dans
#     env.json (deux endroits, dans la Content-Security-Policy) ;
#   - les chemins du certificat, une fois émis. `certbot --nginx -d
#     app.exemple.be` les écrit lui-même.
#
# À placer dans /etc/nginx/sites-available/firestop, puis :
#   ln -s /etc/nginx/sites-available/firestop /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# Les fichiers d'entrée ne sont **jamais** gardés en cache : ce sont eux qui
# disent au navigateur quelle version charger. Mis en cache, une mise à jour
# déployée resterait invisible des postes déjà venus. Le reste peut l'être une
# journée.
#
# Par une `map` et non un `add_header` dans chaque `location` : dans nginx, un
# `add_header` posé dans un bloc **efface** tous ceux du bloc parent. Les
# en-têtes de sécurité ci-dessous disparaîtraient en silence des fichiers
# concernés — précisément `index.html`.
map $uri $firestop_cache {
    default                       "public, max-age=86400";
    /                             "no-cache";
    /index.html                   "no-cache";
    /flutter_bootstrap.js         "no-cache";
    /flutter_service_worker.js    "no-cache";
    /version.json                 "no-cache";
}

# Tout ce qui arrive en clair repart en HTTPS. Ce n'est pas une option : la
# session de l'utilisateur transite par cette page.
server {
    listen 80;
    listen [::]:80;
    server_name app.exemple.be;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.exemple.be;

    ssl_certificate     /etc/letsencrypt/live/app.exemple.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.exemple.be/privkey.pem;

    root  /var/www/firestop;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json application/wasm text/css;

    # --- En-têtes : tous ici, aucun dans les `location` (voir la `map`) -------

    add_header Cache-Control             $firestop_cache always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    # L'application n'a aucune raison d'être affichée dans la page d'un autre
    # site : c'est la porte d'entrée du détournement de clic.
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    # Ce que la page a le droit de charger, et vers où elle a le droit de
    # parler. Éprouvée telle quelle sur la version compilée : l'application
    # démarre sans une seule violation.
    #
    #   - `'wasm-unsafe-eval'` autorise l'exécution de WebAssembly (SQLite, le
    #     moteur de rendu), pas celle de JavaScript arbitraire ;
    #   - `blob:` sert au téléchargement du classeur et au fil d'arrière-plan
    #     de la base ;
    #   - `fonts.gstatic.com` : le moteur de rendu y prend sa police (Roboto)
    #     au premier affichage. La retirer d'ici laisse l'application sans
    #     aucun texte lisible ;
    #   - le projet Supabase, en HTTPS et en WebSocket.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://fonts.gstatic.com https://<projet>.supabase.co wss://<projet>.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SQLite tourne en WebAssembly : servi sous un autre type, le navigateur
    # refuse de l'exécuter, la base locale ne s'ouvre pas et l'application
    # reste sur son écran de démarrage. Les nginx récents connaissent ce type ;
    # l'imposer ici évite de dépendre de la version installée.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
    }

    location / {
        # Une adresse inconnue rend l'application, qui fait son propre routage.
        try_files $uri $uri/ /index.html;
    }
}
