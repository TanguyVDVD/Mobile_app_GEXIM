# Le site FireStop dans l'Apache du VPS.
#
# À copier dans /etc/apache2/sites-available/firestop.conf, en remplaçant
# `app.exemple.be` par le nom de domaine. Mode d'emploi : DEPLOY.md.
#
# Apache reçoit les visiteurs et passe leurs requêtes au conteneur, qui écoute
# sur 127.0.0.1:8088 (`PORT_LOCAL`, dans le fichier .env). Ce fichier ne décrit
# que le site en clair : `certbot --apache` en tire lui-même la version HTTPS
# et la redirection.
#
# **Aucun en-tête de sécurité ici.** Le conteneur les pose déjà ; en double, le
# navigateur applique la plus stricte des deux politiques, et l'application
# peut se retrouver bloquée.

<VirtualHost *:80>
    ServerName app.exemple.be

    # Garder le nom de domaine demandé par le visiteur.
    ProxyPreserveHost On

    ProxyPass        / http://127.0.0.1:8088/
    ProxyPassReverse / http://127.0.0.1:8088/

    ErrorLog  ${APACHE_LOG_DIR}/firestop-error.log
    CustomLog ${APACHE_LOG_DIR}/firestop-access.log combined
</VirtualHost>
