name: firestop_tracker
description: Recensement, photographie et documentation des calfeutrements sur chantier.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # --- Rendu des rapports ---
  # Package Dart pur : la mise en page n'est écrite qu'une fois, et le même
  # code pourra tourner dans un conteneur serveur.
  firestop_report:
    path: packages/firestop_report
  # Plugin Flutter, complément de `pdf` : aperçu, impression et partage. Il
  # reste ici, hors du package, qui doit pouvoir tourner sans Flutter.
  printing: ^5.13.0

  # --- Base locale : source de vérité de l'application ---
  drift: ^2.20.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- État & injection ---
  flutter_riverpod: ^2.5.1

  # --- Navigation ---
  # Routage déclaratif : les redirections selon la session et le rôle vivent en
  # un seul endroit, au lieu d'être dispersées dans les écrans.
  go_router: ^14.6.0

  # --- Backend distant ---
  supabase_flutter: ^2.6.0

  # --- Choix de fichiers (papier à en-tête, logo client) ---
  file_picker: ^10.0.0

  # --- Capture & compression photo ---
  # `camera` (android, ios, web) et `flutter_image_compress` (android, ios,
  # macos, web) n'ont PAS d'implémentation Windows. Aucun des deux ne casse la
  # compilation — un greffon sans implémentation n'est simplement pas
  # enregistré — mais l'appel échoue à l'exécution.
  #
  # La capture est masquée sur PC (`Plateforme.captureDisponible`) ; la
  # réduction, elle, sert aussi au rapport, d'où le repli Dart pur ci-dessous.
  camera: ^0.11.0
  flutter_image_compress: ^2.3.0

  # Repli de réduction JPEG pour Windows et Linux : Dart pur, donc partout.
  # Déjà présent en dépendance transitive de `printing` ; déclaré ici parce que
  # `ReductionDart` l'importe directement. Voir `lib/features/capture/reduction_jpeg.dart`.
  image: ^4.5.0

  # --- Utilitaires ---
  uuid: ^4.5.1
  connectivity_plus: ^6.0.5
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Polices Unicode du rapport PDF. Le dossier est déclaré même s'il ne
    # contient encore que sa notice : `ReportService` cherche les TTF et se
    # rabat sur Helvetica si elles manquent. Voir assets/fonts/README.md.
    - assets/fonts/
