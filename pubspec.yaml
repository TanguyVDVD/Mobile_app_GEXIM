name: firestop_tracker
description: Recensement, photographie et documentation des calfeutrements sur chantier.
publish_to: none
version: 0.5.2+12

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # --- Classeur Excel des fiches AS BUILT ---
  # Package Dart pur : il remplit le modèle du bureau, une feuille par
  # traversée, sans rien connaître de Flutter ni de la base.
  firestop_excel:
    path: packages/firestop_excel

  # --- Base locale : source de vérité de l'application ---
  drift: ^2.20.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- État & injection ---
  flutter_riverpod: ^2.5.1

  # --- Navigation ---
  # Routage déclaratif : les redirections selon la session et le rôle vivent en
  # un seul endroit, au lieu d'être dispersées dans les écrans.
  go_router: ^14.6.0

  # --- Backend distant ---
  supabase_flutter: ^2.6.0

  # --- Choix d'un fichier (logo client) ---
  file_picker: ^10.0.0

  # --- Capture & compression photo ---
  # Le travail de la tablette. La version navigateur consulte les clichés,
  # elle n'en prend pas : voir `Plateforme`.
  camera: ^0.11.0
  flutter_image_compress: ^2.3.0

  # Réduction JPEG en Dart pur : celle du navigateur, à l'export des fiches.
  # Voir `reduireOctets`, dans `lib/features/capture/reduction_jpeg.dart`.
  image: ^4.5.0

  # --- Sortie du classeur ---
  # Feuille de partage sur tablette ; téléchargement dans un navigateur, par
  # `package:web`.
  share_plus: ^12.0.2
  web: ^1.1.1

  # `ClientException` : une panne réseau, telle qu'un navigateur la remonte.
  # Voir `RemoteGateway`.
  http: ^1.2.0

  # --- Utilitaires ---
  uuid: ^4.5.1
  connectivity_plus: ^6.0.5
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  flutter_lints: ^4.0.0
  archive: ^4.3.0

flutter:
  uses-material-design: true

  assets:
    # Modèle du classeur « AS BUILT Resserrages RF », avec ses macros et ses
    # listes déroulantes. Déclaré à la racine plutôt que recopié sous assets/ :
    # deux exemplaires du même document finiraient par diverger, et c'est
    # celui-ci que le bureau retouche. Les emplacements des valeurs y sont
    # relevés, dans `AsBuiltWorkbook` — toute modification du modèle impose de
    # relancer les tests du package `firestop_excel`.
    - AS_BUILT_Resserages_RF_model_vierge.xlsm
