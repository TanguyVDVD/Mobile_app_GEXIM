name: firestop

# =============================================================================
# Banc d'essai local des migrations et des policies RLS.
#
# Ce n'est PAS l'environnement de production : celui-ci est Supabase managé.
# L'intérêt est de rejouer les migrations réelles, sans modification, sur un
# Postgres jetable — pour prouver qu'une policy refuse bien ce qu'elle doit
# refuser avant de la pousser en ligne.
#
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml exec -T db \
#     psql -v ON_ERROR_STOP=1 -U postgres -d firestop < docker/rls_tests.sql
#
# Repartir de zéro après avoir modifié une migration (les scripts d'init ne
# rejouent que sur un volume vide) :
#   docker compose -f docker/docker-compose.yml down -v && ... up -d
# =============================================================================

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firestop
    ports:
      # 54329 plutôt que 5432 : n'entre en conflit ni avec un Postgres local ni
      # avec le 54322 de la CLI Supabase.
      - '54329:5432'
    volumes:
      # Ordre alphabétique = ordre d'exécution.
      - ./postgres/00_stub_supabase.sql:/docker-entrypoint-initdb.d/00_stub_supabase.sql:ro

      # Les migrations réelles, montées telles quelles. Si elles divergeaient de
      # ce qui part en production, le banc d'essai ne prouverait plus rien.
      - ../supabase/migrations/20260913100000_schema.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
      - ../supabase/migrations/20260913100100_rls.sql:/docker-entrypoint-initdb.d/20_rls.sql:ro
      - ../supabase/migrations/20260913100200_storage.sql:/docker-entrypoint-initdb.d/30_storage.sql:ro
      - ../supabase/migrations/20261003100000_product_supplier.sql:/docker-entrypoint-initdb.d/40_product_supplier.sql:ro
      - ../supabase/migrations/20261003110000_project_fields_point_number.sql:/docker-entrypoint-initdb.d/50_project_fields_point_number.sql:ro
      - ../supabase/migrations/20261003130000_point_project_overrides.sql:/docker-entrypoint-initdb.d/60_point_project_overrides.sql:ro
      - ../supabase/migrations/20261003140000_delete_project.sql:/docker-entrypoint-initdb.d/70_delete_project.sql:ro
      - ../supabase/migrations/20261003150000_ref_number_text.sql:/docker-entrypoint-initdb.d/80_ref_number_text.sql:ro
      - ../supabase/migrations/20261003160000_delete_point.sql:/docker-entrypoint-initdb.d/90_delete_point.sql:ro
      - ../supabase/migrations/20261003170000_floors_as_options.sql:/docker-entrypoint-initdb.d/95_floors_as_options.sql:ro

      # Les GRANT que Supabase pose automatiquement, et qu'un Postgres nu ignore.
      - ./postgres/99_grants.sql:/docker-entrypoint-initdb.d/99_grants.sql:ro

      # Après les GRANT, et non à son rang : cette migration **retire** des
      # droits que Supabase accorde à la création de chaque fonction. Sur le
      # banc, ces droits ne sont posés qu'à l'étape précédente — jouée avant,
      # la migration serait aussitôt défaite et son test ne prouverait rien.
      - ../supabase/migrations/20261003120000_revoke_anon_helpers.sql:/docker-entrypoint-initdb.d/99_z_revoke_anon_helpers.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d firestop']
      interval: 3s
      timeout: 3s
      retries: 20
