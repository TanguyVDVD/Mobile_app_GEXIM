name: firestop_report
description: >-
  Rendu des rapports de conformité calfeutrement. Dart pur, sans dépendance
  Flutter : le même code produit l'aperçu dans l'application et le document
  définitif dans un conteneur serveur.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  # `pdf` est du Dart pur et tourne donc sur la VM. `printing`, lui, est un
  # plugin Flutter : il est délibérément absent d'ici, et reste du côté de
  # l'application qui affiche et partage le document.
  pdf: ^3.11.0

dev_dependencies:
  # Pour fabriquer de vrais PNG et JPEG dans les tests. Déjà tiré par `pdf`,
  # qui s'en sert pour décoder tout ce qui n'est pas du JPEG.
  image: ^4.0.0
  test: ^1.25.0
  lints: ^4.0.0
